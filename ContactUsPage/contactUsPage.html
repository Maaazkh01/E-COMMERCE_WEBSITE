<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Contact Us</title>
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Work+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="contactUsPage.css" rel="stylesheet" />
</head>

<body>
    <div class="contact-container">
        <header class="contact-header">
            <div class="header-content">
                <div class="header-nav">
                    <div class="header-left">
                        <a class="logo" href="#">
                            <span class="material-symbols-outlined logo-icon"> store </span>
                            <span class="logo-text">MarketPlace</span>
                        </a>
                        <nav class="nav-menu">
                            <a class="nav-link" href="#">Home</a>
                            <a class="nav-link" href="#">Shop</a>
                            <a class="nav-link" href="#">About</a>
                        </nav>
                    </div>
                    <div class="header-right">
                        <div class="search-container">
                            <span class="material-symbols-outlined search-icon"> search </span>
                            <input class="search-input" placeholder="Search" type="text" />
                        </div>
                        <button class="header-btn">
<span class="material-symbols-outlined"> favorite_border </span>
</button>
                        <button class="header-btn">
<span class="material-symbols-outlined"> shopping_bag </span>
</button>
                        <button class="user-avatar">
<img alt="User avatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDZlh5zmcUuZkGRoBPDtP1gmpjYOYgzJ22_ZVKAEsbO4cfXtrr2iUncDg0fcnGGpLjOj5pn2fX48a0BJKjOWyx3-tpV4QdLgDrUgymquVJ_9AKgKwJMNykRm0i-oKPJVNdcCQ6hQ_teWveYff28eBrmBJmfudTvWYcr5pDL7equ2RzHhuA8lKe7eiUqmYKu6_pRCp-4on3H71OgCMveS1EeSjPhZnZUxBVTgSYUa_-qTBIXJUCM665a67XOtlYPMh4mHQdhS04iRGg"/>
</button>
                    </div>
                </div>
            </div>
        </header>
        <main class="contact-main">
            <div class="main-content">
                <div class="content-wrapper">
                    <div class="hero-section">
                        <h1 class="page-title">Contact Us</h1>
                        <p class="page-subtitle">We'd love to hear from you. Get in touch with us.</p>
                    </div>
                    <div class="content-grid">
                        <div class="form-section">
                            <h2 class="form-title">Send us a message</h2>
                            <form class="contact-form">
                                <div class="form-group">
                                    <label class="form-label" for="name">Your Name</label>
                                    <input class="form-input" id="name" placeholder="Your Name" type="text" />
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="email">Your Email</label>
                                    <input class="form-input" id="email" placeholder="Your Email" type="email" />
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="subject">Subject</label>
                                    <input class="form-input" id="subject" placeholder="Subject" type="text" />
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="message">Your Message</label>
                                    <textarea class="form-textarea" id="message" placeholder="Your Message" rows="5"></textarea>
                                </div>
                                <div class="form-group">
                                    <button class="submit-btn" type="submit">
                    Submit Message
                  </button>
                                </div>
                            </form>
                        </div>
                        <div class="info-section">
                            <div>
                                <h3 class="info-title">Contact Information</h3>
                                <ul class="info-list">
                                    <li class="info-item">
                                        <span class="material-symbols-outlined info-icon"> mail </span>
                                        <span>support@marketplace.com</span>
                                    </li>
                                    <li class="info-item">
                                        <span class="material-symbols-outlined info-icon"> phone </span>
                                        <span>(555) 123-4567</span>
                                    </li>
                                    <li class="info-item">
                                        <span class="material-symbols-outlined info-icon"> location_on </span>
                                        <span>123 Main Street, Anytown, USA</span>
                                    </li>
                                </ul>
                            </div>
                            <div class="map-container">
                                <img alt="Location map" class="map-image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCYxCctP_E8qAOni2UQZV8DrMXYZ00OiNioaszc6kcqpASJotq3e2XIQIcg0t3zQzfCRKBBq71GPUJULYNI83d8JgEeQptXOwqTEsTLiS72ruFLYFT6sP7u4F4yfDDZxvGf1HneFSbSdc30WRsdUVBcOVul35v5b44IoKjCMC1PL1mLIYogMbc9SPONRPbmlaKmMmgjKDRHMRhGklE6RzxqVc3lbM_qOlgBojNsQkHUBF2WNDGBW2B2bC-SzuOJJJ6IeAtYTaVpTxE"
                                />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>

</html>
