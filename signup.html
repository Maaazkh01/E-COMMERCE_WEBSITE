<!-- sign up Page -->

<html>

<head>
    <meta charset="utf-8" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Work+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="preload" />
    <title>Stitch Design</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
        :root { --primary-color: #1173d4; --secondary-color: #f3f4f6; --text-primary: #1f2937; --text-secondary: #6b7280; }
    </style>
</head>

<body class="bg-white">
    <div class="relative flex size-full min-h-screen flex-col bg-white group/design-root overflow-x-hidden" style='font-family: "Work Sans", "Noto Sans", sans-serif;'>
        <div class="layout-container flex h-full grow flex-col">
            <header class="flex items-center justify-between whitespace-nowrap border-b border-gray-200 px-10 py-4">
                <div class="flex items-center gap-4 text-gray-800">
                    <div class="size-6 text-[var(--primary-color)]">
                        <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M24 4H6V17.3333V30.6667H24V44H42V30.6667V17.3333H24V4Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
                    </div>
                    <h2 class="text-xl font-bold tracking-tight text-[var(--text-primary)]">Marketplace</h2>
                </div>
                <div class="flex flex-1 justify-end gap-8">
                    <div class="flex items-center gap-9">
                        <a class="text-sm font-medium text-[var(--text-primary)] hover:text-[var(--primary-color)] transition-colors" href="index.html">Home</a>
                        <a class="text-sm font-medium text-[var(--text-primary)] hover:text-[var(--primary-color)] transition-colors" href="shop.html">Shop</a>
                        <a class="text-sm font-medium text-[var(--text-primary)] hover:text-[var(--primary-color)] transition-colors" href="sell.html">Sell</a>
                    </div>
                    <a class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-md h-10 px-5 bg-gray-100 text-[var(--text-primary)] text-sm font-bold leading-normal tracking-wide hover:bg-gray-200 transition-colors" href="#">
                        <span class="truncate">Login</span>
                    </a>
                </div>
            </header>
            <div class="flex flex-1 items-center justify-center py-16">
                <div class="w-full max-w-md px-8">
                    <div class="text-center">
                        <h1 class="text-3xl font-bold tracking-tighter text-[var(--text-primary)] sm:text-4xl">Create an Account</h1>
                        <p class="mt-4 text-base text-[var(--text-secondary)]">Join our marketplace to start buying and selling.</p>
                    </div>
                    <div class="mt-10 space-y-6">
                        <div class="space-y-4">
                            <button class="flex w-full min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-md h-12 px-4 bg-white border border-gray-300 text-[var(--text-primary)] text-base font-medium leading-normal tracking-wide shadow-sm hover:bg-gray-50 transition-colors">
<div class="flex items-center gap-3">
<svg class="size-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="truncate">Sign up with Google</span>
</div>
</button>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-300"></div>
                            </div>
                            <div class="relative flex justify-center text-sm">
                                <span class="bg-white px-2 text-[var(--text-secondary)]">Or continue with</span>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-medium leading-none text-[var(--text-primary)]" for="email">Email</label>
                            <input class="flex h-12 w-full rounded-md border border-gray-300 bg-transparent px-4 py-2 text-sm text-[var(--text-primary)] placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-offset-2" id="email" placeholder="you@example.com"
                                type="email" />
                        </div>
                        <div class="space-y-2">
                            <label class="text-sm font-medium leading-none text-[var(--text-primary)]" for="password">Password</label>
                            <input class="flex h-12 w-full rounded-md border border-gray-300 bg-transparent px-4 py-2 text-sm text-[var(--text-primary)] placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-offset-2" id="password"
                                placeholder="••••••••" type="password" />
                        </div>
                        <button class="flex w-full min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-md h-12 px-4 bg-[var(--primary-color)] text-white text-base font-bold leading-normal tracking-wide shadow-sm hover:bg-blue-600 transition-colors">
<span class="truncate">Create Account</span>
</button>
                    </div>
                    <p class="mt-6 text-center text-xs text-[var(--text-secondary)]">By creating an account, you agree to our <a class="underline hover:text-[var(--primary-color)]" href="#">Terms of Service</a> and <a class="underline hover:text-[var(--primary-color)]" href="#">Privacy Policy</a>.</p>
                </div>
            </div>
        </div>
    </div>
</body>
Hello
