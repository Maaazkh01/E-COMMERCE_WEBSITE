<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Work+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="preload" />
    <title>Dropshipping website</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="page-container">
        <header class="header">
            <div class="logo-container">
                <div class="logo-icon">
                    <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path clip-rule="evenodd" d="M24 4H6V17.3333V30.6667H24V44H42V30.6667V17.3333H24V4Z" fill="currentColor" fill-rule="evenodd"></path>
                        </svg>
                </div>
                <h2 class="logo-text">Marketplace</h2>
            </div>
            <div class="nav-container">
                <nav>
                    <a class="nav-link" href="homepage/home-page.html">Home</a>
                    <a class="nav-link" href="#">Shop</a>
                    <a class="nav-link" href="#">Sell</a>
                </nav>
                <a class="btn-login" href="#">Login</a>
            </div>
        </header>

        <main class="main">
            <div class="form-box">
                <div class="form-header">
                    <h1 class="form-title">Create an Account</h1>
                    <p class="form-subtitle">Join our marketplace to start buying and selling.</p>
                </div>

                <button class="btn-google">
                        <svg class="google-icon" fill="none" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
                        </svg>
                        Sign up with Google
                    </button>

                <div class="divider"><span>Or continue with</span></div>

                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" class="form-input" placeholder="you@example.com">

                <label for="password" class="form-label">Password</label>
                <div class="password-wrapper">
                    <input id="password" type="password" class="form-input" placeholder="••••••••">
                    <img id="togglePassword" src="images/icons/show_password_ic.png" alt="Show Password" class="toggle-password-icon">
                </div>


                <button class="btn-submit">Create Account</button>

                <p class="terms">
                    By creating an account, you agree to our
                    <a class="link" href="#">Terms of Service</a> and
                    <a class="link" href="#">Privacy Policy</a>.
                </p>
            </div>
        </main>
    </div>
    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";


            // Swap imageing

            togglePassword.src = isPassword ? "images/icons/hide_password_ic.png" : "images/icons/show_password_ic.png";
            togglePassword.alt = isPassword ? "Hide Password" : "Show Password";
        });
    </script>
</body>

</html>
