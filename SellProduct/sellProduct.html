<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Work+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet" />
    <title>Sell Page</title>
    <link rel="stylesheet" href="sellProduct.css">
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
</head>

<body class="sell-page">
    <div class="page-wrapper">
        <div class="page-content">
            <header class="page-header">
                <div class="logo-section">
                    <div class="logo-icon">
                        <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19.9999 10H13.9999V4H9.99994V10H3.99994L11.9999 18L19.9999 10Z" fill="currentColor" transform="translate(0, 1)"></path>
</svg>
                    </div>
                    <h2 class="logo-text">Marketplace</h2>
                </div>
                <div class="nav-section">
                    <label class="search-container">
<span class="sr-only">Search</span>
<span class="search-icon">
<svg class="search-svg" fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg">
<path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path>
</svg>
</span>
<input class="search-input" placeholder="Search items..." value=""/>
</label>
                    <button class="favorite-btn">
<svg class="favorite-icon" fill="currentColor" height="24px" viewBox="0 0 256 256" width="24px" xmlns="http://www.w3.org/2000/svg">
<path d="M178,32c-20.65,0-38.73,8.88-50,23.89C116.73,40.88,98.65,32,78,32A62.07,62.07,0,0,0,16,94c0,70,103.79,126.66,108.21,129a8,8,0,0,0,7.58,0C136.21,220.66,240,164,240,94A62.07,62.07,0,0,0,178,32ZM128,206.8C109.74,196.16,32,147.69,32,94A46.06,46.06,0,0,1,78,48c19.45,0,35.78,10.36,42.6,27a8,8,0,0,0,14.8,0c6.82-16.67,23.15-27,42.6-27a46.06,46.06,0,0,1,46,46C224,147.61,146.24,196.15,128,206.8Z"></path>
</svg>
</button>
                    <div class="profile-image"></div>
                </div>
            </header>
            <main class="main-content">
                <div class="content-wrapper">
                    <div class="page-title-section">
                        <h1 class="page-title">List Your Item for Sale</h1>
                        <p class="page-subtitle">Fill out the details below to put your item on the marketplace.</p>
                    </div>
                    <form class="sell-form">
                        <div class="form-fields">
                            <div class="field-group">
                                <label class="field-label" for="item-name">Item Name</label>
                                <div class="field-wrapper">
                                    <input class="field-input" id="item-name" placeholder="e.g., Vintage Leather Jacket" type="text" />
                                </div>
                            </div>
                            <div class="field-group">
                                <label class="field-label" for="description">Description</label>
                                <div class="field-wrapper">
                                    <textarea class="field-textarea" id="description" placeholder="Describe your item in detail. Include its condition, features, and any imperfections." rows="4"></textarea>
                                </div>
                            </div>
                            <div class="field-row">
                                <div class="field-group">
                                    <label class="field-label" for="price">Price</label>
                                    <div class="price-input-wrapper">
                                        <div class="price-symbol">
                                            <span class="dollar-sign">$</span>
                                        </div>
                                        <input class="field-input price-input" id="price" placeholder="0.00" type="text" />
                                    </div>
                                </div>
                                <div class="field-group">
                                    <label class="field-label" for="category">Category</label>
                                    <div class="field-wrapper">
                                        <select class="field-select" id="category">
<option>Select a category</option>
<option>Electronics</option>
<option>Clothing &amp; Apparel</option>
<option>Home &amp; Garden</option>
<option>Collectibles &amp; Art</option>
<option>Sporting Goods</option>
</select>
                                    </div>
                                </div>
                            </div>
                            <div class="field-group">
                                <label class="field-label">Item Photos</label>
                                <div class="file-upload-area">
                                    <div class="upload-content">
                                        <svg aria-hidden="true" class="upload-icon" fill="currentColor" viewBox="0 0 24 24">
<path clip-rule="evenodd" d="M1.5 6a2.25 2.25 0 012.25-2.25h16.5A2.25 2.25 0 0122.5 6v12a2.25 2.25 0 01-2.25 2.25H3.75A2.25 2.25 0 011.5 18V6zM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0021 18v-1.94l-2.69-2.689a1.5 1.5 0 00-2.12 0l-.88.879.97.97a.75.75 0 11-1.06 1.06l-5.16-5.159a1.5 1.5 0 00-2.12 0L3 16.061zm10.125-7.81a1.125 1.125 0 112.25 0 1.125 1.125 0 01-2.25 0z" fill-rule="evenodd"></path>
</svg>
                                        <div class="upload-text">
                                            <label class="upload-label" for="file-upload">
<span>Upload a file</span>
<input class="file-input" id="file-upload" multiple="" name="file-upload" type="file"/>
</label>
                                            <p class="upload-help">or drag and drop</p>
                                        </div>
                                        <p class="upload-info">PNG, JPG, GIF up to 10MB</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="cancel-btn" type="button">
                  Cancel
                </button>
                            <button class="submit-btn" type="submit">
                  List Item
                </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

</body>

</html>
